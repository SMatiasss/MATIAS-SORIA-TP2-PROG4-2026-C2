<div class="escena">
  <div class="lienzo">
    <video #video class="lienzo__video" src="escena/dashboard/pizarra-giro.webm" preload="auto" playsinline [muted]="true" (ended)="terminarGiro()"></video>

    <!-- Gira junto con la pizarra: cada cara es un dashboard y su contenido va en .contenido -->
    <section class="pizarra" [class.pizarra--gira]="girando()" [class.pizarra--estadisticas]="seccion() === 'estadisticas'" [style.--base.deg]="giros() * -180">
      <div class="cara cara--frente">
        <button type="button" class="placa" [disabled]="girando()" title="Girar la pizarra" (click)="girar(video)">Estadísticas ↑</button>
        <div class="contenido"><app-panel-usuarios /></div>
      </div>

      <div class="cara cara--dorso">
        <button type="button" class="placa" [disabled]="girando()" title="Girar la pizarra" (click)="girar(video)">Usuarios ↑</button>
        <div class="contenido"><app-panel-estadisticas /></div>
      </div>
    </section>
  </div>
</div>
