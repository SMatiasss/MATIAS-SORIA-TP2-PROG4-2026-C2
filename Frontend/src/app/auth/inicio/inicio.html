<div
  class="escena"
  [class.vivo]="vivo()"
  [class.desinflado]="fase() === 'desinflado'"
  [class.desinflando]="fase() === 'desinflando'"
  [class.con-panel]="conPanel()"
>
  <div class="mundo">
    <div class="mundo__interior">
      <!-- fetchpriority: Descarga el fondo antes que las demás imágenes -->
      <img class="fondo" src="escena/inicio/fondo-oscuro.webp" fetchpriority="high" />
      <img class="fondo-luz" src="escena/inicio/fondo-luz.webp" />

      <div class="carpa">
        <div class="sombra"></div>
        <div class="cuadros">
          @for (i of cuadros; track i) {
            <img
              class="cuadro"
              [class.cuadro--inicio]="i === 0"
              [class.cuadro--fin]="i === cuadros.length - 1"
              [style.--i]="i"
              [src]="'escena/inicio/carpa/' + i + '.webp'"
            />
          }
        </div>
        <button
          type="button"
          class="boton-inflar"
          [hidden]="fase() !== 'desinflado'"
          (click)="inflar()"
        ></button>
      </div>

      <div class="humo"></div>
      <div class="humo humo--2"></div>

      <div class="fogata">
        <div class="sombra"></div>
        <img src="escena/inicio/fogata-apagada.webp" />
        <img class="fogata__luz" src="escena/inicio/fogata-luz.webp" />
      </div>

      <div class="llamas">
        <div class="brillo"></div>
        <svg class="llamas__defs">
          <defs>
            <linearGradient id="llama-a" x1="0" y1="1" x2="0" y2="0">
              <stop offset="0" stop-color="#FFE9A8" />
              <stop offset="0.28" stop-color="#FFB23C" />
              <stop offset="0.62" style="stop-color: var(--fuego)" />
              <stop offset="1" style="stop-color: var(--brasa)" stop-opacity="0" />
            </linearGradient>
            <linearGradient id="llama-b" x1="0" y1="1" x2="0" y2="0">
              <stop offset="0" stop-color="#FFFBE6" />
              <stop offset="0.5" stop-color="#FFD36B" />
              <stop offset="1" stop-color="#FFB23C" stop-opacity="0" />
            </linearGradient>
            <filter id="desenfoque-1" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.4" /></filter>
            <filter id="desenfoque-2" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="1.4" /></filter>
          </defs>
        </svg>
        <svg class="lengua lengua--2" viewBox="0 0 200 240"><path filter="url(#desenfoque-1)" fill="url(#llama-a)" d="M70 238 C40 232 30 196 44 166 C52 148 48 132 58 112 C62 128 72 140 78 158 C88 184 94 214 70 238 Z" /></svg>
        <svg class="lengua lengua--3" viewBox="0 0 200 240"><path filter="url(#desenfoque-1)" fill="url(#llama-a)" d="M132 238 C160 232 172 198 158 168 C150 150 154 134 144 114 C140 130 130 142 124 160 C114 186 108 216 132 238 Z" /></svg>
        <svg class="lengua lengua--1" viewBox="0 0 200 240"><path filter="url(#desenfoque-1)" fill="url(#llama-a)" d="M100 238 C60 236 46 190 62 148 C72 120 66 96 84 62 C90 48 96 34 100 12 C104 34 112 48 118 62 C136 96 128 120 138 148 C154 190 140 236 100 238 Z" /></svg>
        <svg class="lengua lengua--4" viewBox="0 0 200 240"><path filter="url(#desenfoque-2)" fill="url(#llama-b)" d="M100 238 C80 236 74 214 82 192 C88 176 96 164 100 140 C104 164 112 176 118 192 C126 214 120 236 100 238 Z" /></svg>
        <span class="chispa" style="--x: -14%; --dx: -312%; --t: 1.7s; --d: 0s"></span>
        <span class="chispa" style="--x: 6%; --dx: 375%; --t: 2.1s; --d: 0.5s"></span>
        <span class="chispa" style="--x: 18%; --dx: 188%; --t: 1.5s; --d: 1.1s"></span>
        <span class="chispa" style="--x: -4%; --dx: -125%; --t: 2.4s; --d: 0.2s"></span>
        <span class="chispa" style="--x: 10%; --dx: -250%; --t: 1.9s; --d: 1.5s"></span>
        <span class="chispa" style="--x: -20%; --dx: -438%; --t: 2.2s; --d: 0.9s"></span>
      </div>
    </div>
  </div>

  <div class="capa capa--titular" [class.capa--visible]="fase() === 'desinflado' || fase() === 'desinflando'">
    <div class="titular">
      <h1>El campamento está desarmado</h1>
      <p class="titular__bajada">Tocá la carpa para armarla e ingresar a YuruCamp.</p>
    </div>
  </div>

  <div class="capa capa--panel">
    <!-- activate: se abrió el login o el registro y la carpa queda armada; deactivate: se cerró y la carpa se desinfla -->
    <router-outlet (activate)="abrirPanel()" (deactivate)="cerrarPanel()" />
  </div>
</div>
